name: Build and formal verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assurance:
    name: Linux x86_64 assurance
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: '2'
      RUST_BACKTRACE: '1'

    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install runner prerequisites
        run: |
          set -euo pipefail
          mkdir -p target/ci-logs
          {
            uname -a
            getconf GNU_LIBC_VERSION
            python3 --version
            rustup --version
            git rev-parse HEAD
            sudo apt-get update
            sudo apt-get install --no-install-recommends --yes \
              build-essential ca-certificates libssl-dev pkg-config python3
            python3 -c 'import platform, sys, tomllib; assert platform.system() == "Linux" and platform.machine() == "x86_64"; assert sys.version_info >= (3, 11); name, version = platform.libc_ver(); assert name == "glibc" and tuple(map(int, version.split("."))) >= (2, 39)'
          } 2>&1 | tee target/ci-logs/prerequisites.log

      - name: Bootstrap pinned verification tools
        run: |
          set -euo pipefail
          bash tools/bootstrap.sh 2>&1 | tee target/ci-logs/bootstrap.log

      - name: Run the complete assurance gate
        run: |
          set -euo pipefail
          source tools/env.sh
          cargo xtask ci 2>&1 | tee target/ci-logs/ci.log

      - name: Prepare the Duvet report for GitHub Pages
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          mkdir -p target/duvet-pages
          cp .duvet/reports/report.html target/duvet-pages/index.html

      - name: Upload the Duvet Pages artifact
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/duvet-pages

      - name: Retain available logs and assurance reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assurance-linux-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            target/ci-logs/*.log
            target/assurance/*.json
            target/assurance/verification-*/verification.stdout.log
            target/assurance/verification-*/verification.stderr.log
            .duvet/reports/report.html
            .duvet/reports/report.json

  publish-duvet-report:
    name: Publish Duvet report
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: assurance
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
      - name: Link the rendered report in the run summary
        env:
          REPORT_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          printf '## Duvet requirements report\n\n[View the rendered report](%s)\n' "$REPORT_URL" >> "$GITHUB_STEP_SUMMARY"
