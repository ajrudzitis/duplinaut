  { package = "duplicity-core", name = "literals_do_not_change_the_basis_for_later_copies" },
  { package = "duplicity-core", name = "all_copy_widths_accept_zero_length_at_the_end_of_the_basis" },
  { package = "duplicity-core", name = "command_consumption_leaves_the_following_command_untouched" },
  { package = "duplicity-core", name = "official_incremental_payloads_match_independent_source_contents" },
