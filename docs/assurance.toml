[[trusted]]
id = "upstream-verus-vest"
reviewed = true
rationale = "Pinned Verus/vstd/solver and Vest combinator primitives constitute upstream verification infrastructure. Vest's frontend is unverified; its generated semantics require independent review. Vest upstream trusted primitive external bodies do not permit project algorithm proof bypasses."
