proofs = []
tests = [{ package = "xtask", name = "tests::duvet_detects_changed_snapshot" }, { package = "xtask", name = "tests::duvet_requires_actual_implementation_and_test_annotations" }, { package = "xtask", name = "tests::missing_verification_tool_is_failure" }, { package = "xtask", name = "tests::stale_generated_parser_rejected" }, { package = "xtask", name = "tests::unreviewed_trust_and_project_proof_shortcuts_rejected" }, { package = "xtask", name = "tests::source_digest_changes_with_source_but_not_ignored_artifacts" }, { package = "xtask", name = "tests::proof_link_requires_declaration_not_a_comment_or_string" }, { package = "xtask", name = "tests::incomplete_or_nonexistent_required_proof_rejected" }, { package = "xtask", name = "tests::missing_milestones_empty_requirements_and_disabled_audit_rejected" }, { package = "xtask", name = "tests::unsuccessful_child_cannot_create_success" }]

