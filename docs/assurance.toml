schema = 1
baseline_enabled = true
specification = "docs/parsing-requirements.md"
algorithm_sources = ["crates/core/src"]

[[generation]]
input = "crates/core/formats/delta.vest"
output = "crates/core/src/generated/delta.rs"
append = "\ninclude!(\"../verified/delta_refinement.rs\");\n"

[[generation]]
input = "crates/core/formats/manifest_token.vest"
output = "crates/core/src/generated/manifest_token.rs"
proof_profile = "manifest-token-facts-v1"

[[generation]]
input = "crates/core/formats/names.vest"
